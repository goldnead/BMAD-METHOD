# ============================================================================
# KUNDEN-JOURNEY-TRIGGERS
# ============================================================================

customer_journey_triggers:
  engagement_triggers:
    high_engagement_events:
      - name: "Multiple Content Downloads"
        threshold: "5 downloads in 7 days"
        action: "Send consideration-stage content with product recommendations"

      - name: "Social Media Tagging"
        threshold: "3 social mentions in 30 days"
        action: "Send personalized outreach and offer expert consultation"

  conversion_triggers:
    cart_abandonment:
      detection_method: "Exit intent detection + 30 minute inactivity"
      action: "Send retargeting email with social proof and urgency"
      follow_up_sequence: "24 hours → 72 hours → 7 days"

    purchase_completion:
      immediate_actions: ["Welcome email", "Onboarding materials", "Community invitation"]
      journey_progression: "Move to retention stage immediately"
      value_reinforcement: ["Purchase confirmation", "Bonus materials access"]

  churn_prevention:
    at_risk_identification:
      signals: ["No engagement for 30 days", "Support ticket patterns", "Content consumption drop"]
      action: "Proactive outreach with personalized re-engagement content"

  reactivation_campaigns:
    dormant_customers:
      criteria: "No purchase or engagement in 90+ days"
      strategy: ["Success story updates", "New feature announcements", "Special comeback offer"]
      offer_type: "Access to updated content + personal consultation"

# ============================================================================
# DATEN-INTEGRATION (FÜR AGENTEN)
# ============================================================================

integration_requirements:
  data_sources:
    thrivecart_api:
      integration_type: "Sales tracking and conversion data"
      data_points: ["Purchase events", "Product performance", "Customer lifetime value", "Referral tracking"]
      update_frequency: "real-time"
      privacy_compliance: "GDPR compliant with customer consent"

    brevo_api:
      integration_type: "Email engagement and segmentation"
      data_points: ["Open rates", "Click rates", "Segment performance", "Automation triggers"]
      update_frequency: "daily sync"
      personalization_features: ["Behavioral triggers", "Journey stage content"]

    google_analytics:
      integration_type: "Website behavior and conversion tracking"
      data_points: ["Page views", "Time on page", "Conversion paths", "Content performance"]
      update_frequency: "daily batch processing"
      attribution_model: "Multi-touch attribution for customer journey"

  webhook_configuration:
    thrivecart_webhooks:
      events: ["order.created", "order.completed", "subscription.created", "customer.updated"]
      processing: "Real-time customer journey updates"
      security: "Signed webhook URLs with IP whitelisting"

    automation_workflows:
      - trigger_logic: "Customer journey stage changes"
        content_selection: "Behavioral segment + stage-appropriate content"
        cta_personalization: "Dynamic CTA based on customer data and journey position"

# ============================================================================
# PERFORMANCE-MESSUNG (FÜR JOURNEY-OPTIMIERUNG)
# ============================================================================

journey_performance_metrics:
  stage_conversion_rates:
    - awareness_to_consideration: "Track newsletter signup to trial enrollment rate"
      target_benchmark: "15-20%"
      optimization_focus: ["Newsletter content", "Signup process", "Initial engagement"]
    - consideration_to_decision: "Track trial participation to purchase conversion"
      target_benchmark: "20-25%"
      optimization_focus: ["Trial experience", "Product demonstration", "Value proposition clarity"]
    - customer_lifetime_value:
        clv_by_segment:
          content_consumers: "€3,000-5,000"
          relationship_builders: "€5,000-8,000"
          strategic_planners: "€10,000-20,000"

        clv_optimization_strategies:
          - "Increase repeat purchases through community and progression"
          - "Improve retention with personalized support and advanced offerings"
          - "Maximize lifetime value through premium upgrades and referrals"

  journey_effectiveness:
    touchpoint_optimization:
      metric: "Cost per touchpoint and touchpoint effectiveness"
      analysis: "Channel-specific engagement rates and conversion costs"

    content_performance:
      metric: "Stage-specific content performance and engagement"
      analysis: "Content types and formats that drive progression to next stage"

# ============================================================================
# DATENSCHUTZ- UND PRIVACY
# ============================================================================

data_protection:
  gdpr_compliance:
    consent_management: "Explicit consent for data processing and personalization"
    data_minimization: "Collect only necessary data for personalization"
    right_to_access: "Customer right to access, modify, and delete personal data"
    anonymization: "Aggregate data anonymized for analysis without personal identifiers"

  security_measures:
    encryption: "All customer data encrypted at rest and in transit"
    access_controls: "Role-based access to customer journey data"
    audit_logging: "Comprehensive logging of data access and modifications"

  data_retention:
    customer_data: "2 years post-last-activity or as required by law"
    journey_logs: "3 years for operational analytics, then anonymized"
    automated_deletion: "Automatic deletion of expired or withdrawn consent data"
