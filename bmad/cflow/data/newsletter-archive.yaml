# ============================================================================
# CONTENT-CALENDER-VERWALTUNG (FÜR PLANUNG)
# ============================================================================

# Editorial Calendar mit Abhängigkeiten
content_dependencies:
  topic_dependencies:
    grundlagen_cvt: []
      # "cvt_grundlagen" muss vor "fehlerquellen_loesungen"
      # "stimmbildung_chor" baut auf "grundlagen_cvt" auf
      # "blending_basics" benötigt "intonation_training"

    sequential_topics:
      - sequence: ["register_ueberblendung", "advanced_techniques"]
        dependency: ["blending_basics"]
      - sequence: ["solo_development", "ensemble_integration"]
        dependency: ["harmony_training", "dynamic_control"]

# Editorial-Zyklen
editorial_cycles:
  foundation_cycle:
    topics: ["grundlagen_cvt", "stimmbildung_chor"]
    frequency: "monthly"
    priority: "high"

  application_cycle:
    topics: ["fehlerquellen_loesungen", "blending_basics", "chorleitung"]
    frequency: "bi-weekly"
    priority: "medium"

  advancement_cycle:
    topics: ["register_ueberblendung", "vocal_health", "advanced_techniques"]
    frequency: "quarterly"
    priority: "low"

# ============================================================================
# AGENTEN-INTEGRATIONS-REGELN
# ============================================================================

# Regeln für den Zugriff der Agenten auf die Daten
agent_integration_rules:
  data_access_permissions:
    connect_agent:
      read_access: ["success_stories", "customer_insights", "topic_preferences"]
      write_access: ["interview_protocols", "customer_journey_updates"]

    forge_agent:
      read_access: ["newsletter_archive", "performance_metrics", "customer_journey"]
      write_access: ["content_logs", "template_usage_stats"]

    validator_agent:
      read_access: ["authenticity_scores", "customer_feedback", "quality_metrics"]
      write_access: ["validation_reports", "improvement_logs"]

    pipeline_agent:
      read_access: ["campaign_results", "subscriber_segments", "publishing_logs"]
      write_access: ["publishing_queue", "success_metrics"]

  data_synchronization:
    sync_frequency: "daily"
    conflict_resolution: "last_write_wins"
    backup_strategy: "incremental_with_full_weekly"

# ============================================================================
# LEISTUNGSMETRIKEN (FÜR CONTINUOUS IMPROVEMENT)
# ============================================================================

# KPIs für Newsletter-Archiv-Analyse
analytics_kpis:
  engagement_metrics:
    open_rate_target: ">25%"
    click_rate_target: ">4%"
    forward_rate_target: ">2%"
    reply_rate_target: ">3%"
    unsubscribe_rate_target: "<1%"

  conversion_metrics:
    trial_conversion_target: ">4%"
    purchase_conversion_target: ">1%"
    revenue_per_newsletter_target: ">15€"
    customer_lifetime_value_target: ">2000€"

  content_quality_metrics:
    authenticity_score_average_target: ">75"
    spam_score_target: "<1%"
    bounce_rate_target: "<2%"

  list_health_metrics:
    growth_rate_target: ">8% monthly"
    churn_rate_target: "<5% quarterly"
    engagement_segmentation_quality: ">0.8"

# ============================================================================
# AUTOMATISIERTE GENERIERUNGS-REGELN
# ============================================================================

# Regeln für die automatische Generierung von Newslettern basierend auf Archivdaten
automated_generation:
  content_selection:
    top_performing_topics_priority: true
    trending_keywords_integration: true
    seasonal_content_scheduling: true
    customer_journey_mapping: true

  personalization_logic:
    dynamic_subject_lines: true
    personalized_content_blocks: true
    behavioral_triggers: true

  quality_assurance:
    authenticity_check_before_send: true
    spam_score_check_before_send: true
    link_validation_before_send: true
    a_b_test_automation: true

