# Inhalts-Templates für wiederholende Themen
content_templates:
  seasonal_content:
    weihnachtszeit_chorvorbereitung:
      title_template: "Weihnachtslieder-Vorbereitung mit CVT: Die stimmliche Freude bewahren"
      content_highlights: ["Stimmentraining bei kaltem Wetter", "Festliche Anforderungen an die Stimme", "CVT-Schutztechniken"]
      cta_suggestions: ["winter_harmony_workshop", "vitality_package", "holiday_special"]
      performance_history:
        - date: "2024-12-15"
          open_rate: 0.34
          click_rate: 0.056
          conversions: 5
          revenue_impact: 245

    sommerpause_chorpflege:
      title_template: "Sommerpause für Chöre: CVT-Regeneration und -Pflege"
      content_highlights: ["Stimmhygiene im Sommer", "Leise Übungen für Pause", "Regenerations-Techniken"]
      cta_suggestions: ["summer_workshop_series", "voice_care_package", "early_bird_special"]
      performance_history:
        - date: "2024-07-20"
          open_rate: 0.31
          click_rate: 0.048
          conversions: 8
          revenue_impact: 342

  success_stories:
    customer_transformations:
      template_name: "chor_success_story"
      title_pattern: "Vorher-Nachher: Wie [Name] den Chor [Erfolg] erreichte"
      content_structure: ["Problem", "CVT-Lösung", "Implementierung", "Ergebnisse", "Adrians Analyse"]
      usage_frequency: "quarterly"
      conversion_boost_rate: 0.15

# ============================================================================
# AUTOMATISIERTE VERWENDUNGS-REGELN (FÜR AGENTEN)
# ============================================================================

# Regeln für Content-Wiederverwendung
reuse_guidelines:
  content_reuse_rules:
    min_time_between_reuse: 30 # Tage zwischen identischer Content-Nutzung
    max_similar_content_per_quarter: 2 # Maximal 2 ähnliche Themen pro Quartal
    required_freshness_percentage: 70 # Mindestens 70% neuer Content pro Newsletter
    topic_rotation_frequency: "quarterly" # Themenrotation nach Quartal

  evergreen_content:
    refresh_cycle: "quarterly" # Aktualisierung von Evergreen-Inhalten
    performance_based_prioritization: true # Bessere Leistung = häufigere Wiederverwendung
    update_triggers: ["new_research", "technique_improvement", "customer_feedback"]

  personalization_rules:
    dynamic_content_blocks: true # Dynamische Inhaltsblöcke basierend auf Verlauf
    journey_stage_adaptation: true # Anpassung an Customer Journey Stage
    recent_interaction_context: 30 # Letzte 30 Tage für Kontext
    preference_based_selection: true # Auswahl basierend auf Vorlieben

