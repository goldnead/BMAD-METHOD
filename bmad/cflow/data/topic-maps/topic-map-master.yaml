# Content Production Pipeline (basierend auf Business-Plan)
production_pipeline:
  weekly_goals:
    articles: 2 # Erhöht von 1 auf 2 für schnelleres Wachstum
    newsletters: 1
    social_posts: 8 # Pro Artikel: LinkedIn, Instagram (Reel+Carousel), X, Facebook
    analytics_reports: 1

  content_types:
    newsletter:
      platform: "brevo"
      template: "newsletter-template.md"
      scheduling: "weekly"
      cta_strategy: "progressive" # Newsletter → Mini-Kurs → Trial → VE → ProGroup

    seo_article:
      platform: "webflow"
      template: "seo-article-template.md"
      scheduling: "twice-weekly"
      optimization: "topic-cluster-based"

    social_media:
      platforms: ["linkedin", "instagram", "x", "facebook"]
      templates:
        linkedin: "linkedin-professional-post.md"
        linkedin_carousel: "linkedin-carousel.md"
        instagram: "instagram-reel-script.md"
        instagram_carousel: "instagram-carousel.md"
        x: "x-thread-template.md"
        facebook: "facebook-community-post.md"
      scheduling: "automated"
      repurposing_strategy: "article-to-social-multiplier"

